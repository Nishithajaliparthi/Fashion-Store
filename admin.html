<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product studio — LUXE</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="wordmark" href="index.html">LUXE<span>.</span></a><nav class="main-nav"><a href="index.html">Storefront</a><a class="active" href="admin.html">Product studio</a></nav><div class="header-actions"><a id="account-link" href="login.html" class="icon-link">Sign in</a></div></header><main class="section-wrap page-content admin-layout"><div><p class="eyebrow">STORE MANAGEMENT</p><h1>Product <em>studio.</em></h1><p class="muted">Add, update or remove pieces from your collection.</p></div><section class="admin-panel"><h2 id="form-title">Add a product</h2><form id="product-form" class="admin-form"><input type="hidden" id="product-id"><label>Product name<input id="product-name" required maxlength="60"></label><div class="form-row"><label>Price (₹)<input id="product-price" type="number" min="1" required></label><label>Category<select id="product-category"><option>Clothing</option><option>Bags</option><option>Shoes</option><option>Accessories</option></select></label></div><label>Image URL<input id="product-image" type="url" placeholder="https://..." required></label><label>Description<textarea id="product-description" rows="3" required></textarea></label><div class="form-row"><button class="button button-dark" id="save-product">Save product ↗</button><button class="button button-outline hidden" type="button" id="cancel-edit">Cancel</button></div><p id="admin-message" class="form-message"></p></form></section><section class="admin-list"><div class="section-heading"><h2>Current collection</h2><span class="muted" id="admin-count"></span></div><div id="admin-products"></div></section></main><footer class="footer"><a class="wordmark" href="index.html">LUXE<span>.</span></a><small>Frontend demo — product data is stored in this browser.</small></footer><script src="js/app.js"></script><script src="js/products.js"></script><script src="js/admin.js"></script></body></html>
